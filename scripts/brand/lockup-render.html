<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/css/app.css">
<style>
body{margin:0;background:transparent}
.tile{display:inline-flex;align-items:center;padding:24px 32px}
.tile.dark{background:#1f2f58;color:#efe9df}
.tile.light{background:#efe9df;color:#17130f}
.l{display:flex;align-items:center;gap:28px}
.l .nw{height:96px;width:auto;display:block}
.l .rule{width:2px;height:72px;background:currentColor;opacity:.35}
.l .cc{display:flex;align-items:center;gap:18px}
.l .cc img{width:82px;height:82px;display:block}
.l .cc span{font:600 24px/1.3 'Manrope',sans-serif;letter-spacing:.18em;text-transform:uppercase}
.mark{width:512px;height:512px;display:block}
</style></head><body>
<div class="tile dark" id="lockup-light"><div class="l"><img class="nw" src="/images/brand/logo-light.png" alt=""><span class="rule"></span><div class="cc"><img src="/images/concierge/cc-mark.svg" alt=""><span>Carpentry<br>Concierge</span></div></div></div>
<div class="tile light" id="lockup-dark"><div class="l"><img class="nw" src="/images/brand/logo-dark.png" alt=""><span class="rule"></span><div class="cc"><img src="/images/concierge/cc-mark.svg" alt=""><span>Carpentry<br>Concierge</span></div></div></div>
<img class="mark" id="mark512" src="/images/concierge/cc-mark.svg" alt="">
</body></html>
